name: Reemplazar video Encontrarte desde Google Drive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/importar-video-encontrarte.yml"
      - ".github/importar-video-encontrarte.txt"

permissions:
  contents: write

jobs:
  actualizar-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: true
      - name: Descargar video subido a Google Drive
        run: |
          python3 -m pip install --disable-pip-version-check "gdown==5.2.0"
          python3 -m gdown "https://drive.google.com/uc?id=1Fq_SZK9bIROh-A3zkyg4g9GuekIwu73D" -O encontrarte-final.mp4
          echo "c126a9cb1c25fc264944c69dc72b2c7b38b32c74d8487df887c2a0082aa655b6  encontrarte-final.mp4" | sha256sum --check -
      - name: Publicar video en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add encontrarte-final.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Reemplazar video Encontrarte"
            git push origin HEAD:main
          fi
